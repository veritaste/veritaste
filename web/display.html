<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Display — Veritaste</title>
<link rel="stylesheet" href="/display.css">
</head>
<body>
<header>
  <div class="brand"><span class="brand__veri">VERI</span><span class="brand__taste">TASTE</span></div>
  <div class="title">Kitchen Display · <span id="hall">…</span></div>
  <div class="svc" id="svc"></div>
  <div class="clock" id="clock" aria-hidden="true"></div>
</header>

<div class="stale" id="stale" hidden>
  Connection lost — showing the board as of <span id="staleTime"></span>.
</div>

<main>
  <section id="list" aria-live="polite"></section>
  <aside class="rail">
    <div id="demand" hidden></div>
    <div id="grilltile" hidden></div>
  </aside>
</main>

<div class="mark86" aria-hidden="true">86</div>

<script src="/display.js"></script>
</body>
</html>
