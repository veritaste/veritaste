upstream veritaste_app {
    server 127.0.0.1:8000 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name veritaste.org www.veritaste.org;

    root /srv/veritaste/web;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass         http://veritaste_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 90s;
    }

    location = /monitor/health { proxy_pass http://veritaste_app; access_log off; }
    location = /health         { proxy_pass http://veritaste_app; access_log off; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
