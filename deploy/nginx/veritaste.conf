limit_req_zone $binary_remote_addr zone=veritaste_api:10m rate=10r/s;

upstream veritaste_app {
    server 127.0.0.1:8000 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name veritaste.org www.veritaste.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://veritaste.org$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name veritaste.org;

    ssl_certificate     /etc/letsencrypt/live/veritaste.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veritaste.org/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:VeritasteTLS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    root /srv/veritaste/web;
    index index.html;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(self)" always;

    client_max_body_size 2m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    location /api/ {
        limit_req zone=veritaste_api burst=20 nodelay;

        proxy_pass         http://veritaste_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    90s;

        proxy_no_cache     $cookie_veritaste_session;
        proxy_cache_bypass $cookie_veritaste_session;
    }

    location = /monitor/health { proxy_pass http://veritaste_app; access_log off; }
    location = /health         { proxy_pass http://veritaste_app; access_log off; }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.veritaste.org;

    ssl_certificate     /etc/letsencrypt/live/veritaste.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veritaste.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:VeritasteTLS:10m;

    return 301 https://veritaste.org$request_uri;
}
